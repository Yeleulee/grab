# Render Blueprint — New + → Blueprint → pick this repo. Redeploys automatically on every git push.
services:
  - type: web
    name: grab
    runtime: docker
    plan: free # sleeps after 15 min idle, wakes automatically on the next visit (~30-60 s)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_USER
        value: grab
      - key: APP_PASSWORD
        sync: false # Render asks for this when you create the Blueprint; never commit it
