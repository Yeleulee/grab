# Render Blueprint — New + → Blueprint → pick this repo. Redeploys automatically on every git push.
services:
  - type: web
    name: grab
    runtime: docker
    plan: free # sleeps after 15 min idle, wakes automatically on the next visit (~30-60 s)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Optional: set APP_PASSWORD (and APP_USER) to require a sign-in. Without it the app is open to anyone with the URL.
      - key: ALLOWED_ORIGINS
        value: https://grab-blond.vercel.app,https://grabb-xi.vercel.app # the Vercel frontends; comma-separate to add more
