# Keeps the Render free-tier API awake. Render spins a free service down after 15 idle minutes and the next
# visitor waits 30–60 s while it boots ("Checking engine…" in the app). A ping every 10 minutes prevents that.
# GitHub may delay scheduled runs by a few minutes; that's fine. Disable or delete this if you move off the free tier.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: |
          url="${API_URL:-https://grab-dkfd.onrender.com}/api/health"
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 90 "$url") && [ "$code" = "200" ] && break
            echo "attempt $i -> $code; retrying"; sleep 20
          done
          echo "status: $code"; cat /tmp/health.json || true
          [ "$code" = "200" ]
        env:
          API_URL: ${{ vars.API_URL }}
