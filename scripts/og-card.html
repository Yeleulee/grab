<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
/* Link-preview card (og:image, 1200×630). Rendered by: node scripts/render-hero.mjs --og */
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { font-family: "Inter", "Inter Variable", "Segoe UI", system-ui, sans-serif; background: #e9e9e9; color: #141414; -webkit-font-smoothing: antialiased; position: relative; }
.chrome { position: absolute; font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #6b6b6b; }
.brand { position: absolute; left: 56px; top: 48px; display: flex; align-items: center; gap: 14px; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
.brand img { width: 44px; height: 44px; display: block; }
.title { position: absolute; left: 56px; top: 150px; font-size: 104px; line-height: .9; letter-spacing: -0.045em; text-transform: uppercase; font-weight: 600; }
.title i { color: #ff3b3b; font-style: normal; }
.sub { position: absolute; left: 56px; top: 452px; font-size: 22px; color: #6b6b6b; line-height: 1.4; max-width: 600px; }
.chips { position: absolute; left: 56px; bottom: 52px; display: flex; gap: 10px; }
.chips span { padding: 9px 16px; border: 1.5px solid rgba(0,0,0,.25); border-radius: 9px; font-size: 17px; font-weight: 500; }
.chips span.ink { background: #141414; color: #fff; border-color: #141414; }
.card { position: absolute; right: 40px; top: 150px; width: 420px; background: #fff; border-radius: 22px; padding: 20px; box-shadow: 0 40px 80px -40px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.06); transform: rotate(-4deg); }
.card .thumb { height: 214px; border-radius: 14px; overflow: hidden; background: #000; position: relative; }
.card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .thumb em { position: absolute; right: 10px; bottom: 10px; font-style: normal; background: rgba(0,0,0,.8); color: #fff; font-size: 13px; padding: 3px 8px; border-radius: 5px; font-family: "JetBrains Mono", monospace; }
.card .row { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding: 12px 14px; background: #f1f1f1; border-radius: 12px; font-size: 18px; font-weight: 600; }
.card .row i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #141414; display: grid; place-items: center; }
.card .row i::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #141414; }
.card .row b { font-size: 12px; font-weight: 600; color: #fff; background: #ff3b3b; padding: 4px 8px; border-radius: 6px; }
.card .row em { font-style: normal; margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 15px; font-weight: 400; }
.card .bar { height: 5px; background: #e9e9e9; border-radius: 3px; margin-top: 16px; overflow: hidden; }
.card .bar i { display: block; width: 100%; height: 100%; background: #1a7f37; }
</style>
</head>
<body>
  <div class="brand"><img src="../public/logo.png" alt="" />Grab</div>
  <div class="chrome" style="right:56px;top:60px">grabb-xi.vercel.app</div>
  <div class="title">Save any<br />YouTube<br />video<i>.</i></div>
  <div class="sub">Exact resolution, right codec, straight to your disk. No ads, no API keys, nothing uploaded.</div>
  <div class="chips"><span class="ink">Up to 4K</span><span>MP4 · MP3 · M4A</span><span>Free</span></div>
  <div class="card">
    <div class="thumb"><img src="hero-thumb.jpg" alt="" /><em>1:06</em></div>
    <div class="row"><i></i>1080p <b>Recommended</b><em>9.1 MB</em></div>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
